<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Elevation 3">
  
  <defs>
    <linearGradient id="sky-frame2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFC6B4"/>
      <stop offset=".55" stop-color="#E6DECD"/>
      <stop offset="1" stop-color="#F1EADC"/>
    </linearGradient>
    <radialGradient id="sun-frame2" cx="0.66" cy=".34" r=".55">
      <stop offset="0" stop-color="#E3BB7C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#E3BB7C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-frame2" x1="0" y1="0" x2=".3" y2="1">
