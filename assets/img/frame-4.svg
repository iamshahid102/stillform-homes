<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Elevation 4">
  
  <defs>
    <linearGradient id="sky-frame3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFC6B4"/>
      <stop offset=".55" stop-color="#E6DECD"/>
      <stop offset="1" stop-color="#F1EADC"/>
    </linearGradient>
    <radialGradient id="sun-frame3" cx="0.66" cy=".34" r=".55">
      <stop offset="0" stop-color="#E3BB7C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#E3BB7C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-frame3" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#E3BB7C" stop-opacity=".92"/>
      <stop offset="1" stop-color="#C98F4E" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="shade-frame3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".26"/>
      <stop offset="1" stop-color="#000" stop-opacity=".04"/>
    </linearGradient>
    <filter id="soft-frame3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain-frame3">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
    <clipPath id="clip-frame3"><rect width="1600" height="1000"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky-frame3)"/>
  <rect width="1600" height="1000" fill="url(#sun-frame3)"/>
  <rect y="720" width="1600" height="280" fill="#C4B8A2"/>
  <rect y="720" width="1600" height="280" fill="#2A2725" opacity=".08"/>
  <rect x="280" y="726" width="1040" height="120" fill="#2A2725" opacity=".08" filter="url(#soft-frame3)"/>
  <!-- side mass -->
  <rect x="1060" y="460" width="60" height="260" fill="#B3A48C"/>
  <rect x="1060" y="460" width="60" height="260" fill="#2A2725" opacity=".18"/>
  <!-- front mass -->
  <rect x="420" y="420" width="640" height="300" fill="#DDD2BC"/>
  <rect x="420" y="420" width="640" height="18" fill="#F4EEE1"/>
  <rect x="772" y="420" width="288" height="300" fill="url(#shade-frame3)" opacity=".45"/>
  <rect x="452" y="462" width="88" height="156" fill="#2A2725" opacity=".82"/><rect x="612" y="462" width="88" height="156" fill="#2A2725" opacity=".82"/><rect x="772" y="462" width="88" height="156" fill="#2A2725" opacity=".82"/><rect x="932" y="462" width="88" height="156" fill="#2A2725" opacity=".82"/>
  <!-- lower wing -->
  <rect x="360" y="530" width="396.8" height="190" fill="#F4EEE1"/>
  <rect x="386.4533333333333" y="572" width="72.74666666666668" height="98.8" fill="#2A2725" opacity=".82"/><rect x="518.72" y="572" width="72.74666666666668" height="98.8" fill="#2A2725" opacity=".82"/><rect x="650.9866666666667" y="572" width="72.74666666666668" height="98.8" fill="#2A2725" opacity=".82"/>
  <rect x="360" y="530" width="396.8" height="12" fill="#C4B8A2"/>
  <rect width="1600" height="1000" fill="none"/>
    <radialGradient id="vig" cx=".5" cy=".5" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </radialGradient>
    <rect width="1600" height="1000" fill="url(#vig)"/>
  <rect width="1600" height="1000" filter="url(#grain-frame3)" opacity=".5"/>
</svg>
