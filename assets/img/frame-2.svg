<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Elevation 2">
  
  <defs>
    <linearGradient id="sky-frame1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFC6B4"/>
      <stop offset=".55" stop-color="#E6DECD"/>
      <stop offset="1" stop-color="#F1EADC"/>
    </linearGradient>
    <radialGradient id="sun-frame1" cx="0.66" cy=".34" r=".55">
      <stop offset="0" stop-color="#E3BB7C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#E3BB7C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass-frame1" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#E3BB7C" stop-opacity=".92"/>
      <stop offset="1" stop-color="#C98F4E" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="shade-frame1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".26"/>
      <stop offset="1" stop-color="#000" stop-opacity=".04"/>
    </linearGradient>
    <filter id="soft-frame1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain-frame1">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
    </filter>
    <clipPath id="clip-frame1"><rect width="1600" height="1000"/></clipPath>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky-frame1)"/>
  <rect width="1600" height="1000" fill="url(#sun-frame1)"/>
  <rect y="720" width="1600" height="280" fill="#C4B8A2"/>
  <rect y="720" width="1600" height="280" fill="#2A2725" opacity=".08"/>
  <rect x="280" y="726" width="1040" height="120" fill="#2A2725" opacity=".08" filter="url(#soft-frame1)"/>
  <!-- side mass -->
  <rect x="610" y="460" width="319.8076211353316" height="260" fill="#B3A48C"/>
  <rect x="610" y="460" width="319.8076211353316" height="260" fill="#2A2725" opacity=".18"/>
  <!-- front mass -->
  <rect x="929.8076211353316" y="420" width="379.99999999999994" height="300" fill="#DDD2BC"/>
  <rect x="929.8076211353316" y="420" width="379.99999999999994" height="18" fill="#F4EEE1"/>
  <rect x="1138.8076211353316" y="420" width="170.99999999999997" height="300" fill="url(#shade-frame1)" opacity=".45"/>
  <rect x="955.140954468665" y="462" width="69.66666666666666" height="156" fill="#2A2725" opacity=".82"/><rect x="1081.8076211353316" y="462" width="69.66666666666666" height="156" fill="#2A2725" opacity=".82"/><rect x="1208.4742878019981" y="462" width="69.66666666666666" height="156" fill="#2A2725" opacity=".82"/>
  <!-- lower wing -->
  <rect x="869.8076211353316" y="530" width="235.59999999999997" height="190" fill="#F4EEE1"/>
  <rect x="885.5142878019983" y="572" width="43.19333333333333" height="98.8" fill="#2A2725" opacity=".82"/><rect x="964.0476211353316" y="572" width="43.19333333333333" height="98.8" fill="#2A2725" opacity=".82"/><rect x="1042.580954468665" y="572" width="43.19333333333333" height="98.8" fill="#2A2725" opacity=".82"/>
  <rect x="869.8076211353316" y="530" width="235.59999999999997" height="12" fill="#C4B8A2"/>
  <rect width="1600" height="1000" fill="none"/>
    <radialGradient id="vig" cx=".5" cy=".5" r=".78">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </radialGradient>
    <rect width="1600" height="1000" fill="url(#vig)"/>
  <rect width="1600" height="1000" filter="url(#grain-frame1)" opacity=".5"/>
</svg>
